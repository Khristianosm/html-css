<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 { /*dislay box-level*/
            background-color: brown;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkgreen;
            /*Border podemos simplificar assim: (border: 10px solid green;)*/

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*Padding simplificamos assim: (padding: 10px 10px 10px 10px)*/
            /*(padding: 10px) se todas as medidas forem iguais*/
            /*(padding: 10px 20px;) primeiro valor é top e bottom, o segundo valor é right e left: se tiver dois valores*/ 
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 20px;
            margin-left: 20px;
            /*margin simplificamos assim: (margin: 10px 10px 10px 10px)*/
            /*(margin: 10px auto 20px auto;) ajusta automático as margens direita/esquerda */
            
            outline-width: 5px;
            outline-style: dashed;
            outline-color: rgb(58, 119, 155);

        }

        a { /*inline-level*/
            border-width: 5px;
            border-style: solid;
            border-color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos são exemplos de caixas inline-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo funciona</p>
    
</body>
</html>
