<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando caixas na vertical</title>
    <style>
        #conteiner {
            position: relative;
            height: 500px;
            padding: 10px;
            background-color: rgb(93, 93, 184);
        }

        #conteudo {
            position: absolute;
            height: 200px;
            width: 300px;
            background-color: rgb(33, 145, 120);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
            
        }
    </style>
</head>
<body>
    <section id="conteiner">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
