<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            
        }
        th, td {
            border: 1px solid black; 
            text-align: center;
            padding: 15px;           
        } 
        th {
            background-color: darkgrey;
        }    
        
    </style>
</head>
<body>
    <table>
        <thead class="cinza">
        <tr>
            <th rowspan="2" scope="colgroup">Área</th>
            <th rowspan="2" scope="colgroup">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>                     
            <th rowspan="2" scope="colgroup">Média</th>            
        </tr>
        <tr>
            <th>Nota 01</th>
            <th>Nota 02</th>              
        </tr>
        </thead>
        <tbody class="medias">
        <tr>
            <td rowspan="4">Exatas</td>
            <td>Matemática</td>
            <td>8,5</td>
            <td>7,5</td>
            <td>8,0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>8,0</td>
            <td>6,0</td>
            <td>7,0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>9,0</td>
            <td>8,5</td>
            <td>8,5</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>7,0</td>
            <td>7,0</td>
            <td>7,0</td>
        </tr>
        <tr>
            <th colspan="4" scope="row">Médias de Exatas = </th>
            <td>7,5</td>
        </tr>
        <tr>
            <td rowspan="2">Humanas</td>
            <td>História</td>
            <td>8,0</td>
            <td>9,5</td>
            <td>8,5</td>            
        </tr>
        <tr>
            <td>Geografia</td>
            <td>10,0</td>
            <td>9,5</td>
            <td>9,5</td>
        </tr>
        <th colspan="4">Médias de Humanas = </th>
        <td>9,0</td>
        </tbody>
    </table>
    
</body>
</html>
